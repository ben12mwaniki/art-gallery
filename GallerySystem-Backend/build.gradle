plugins {
    id 'org.springframework.boot' version '2.3.4.RELEASE'
    id 'io.spring.dependency-management' version '1.0.10.RELEASE'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    // Optional: keep if you want explicit Mockito version control
    testImplementation 'org.mockito:mockito-core:2.+'
    testImplementation 'org.mockito:mockito-junit-jupiter:2.18.3'
}

bootRun {
    def envFile = file(".env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            if (line && line.contains("=")) {
                def (key, value) = line.split("=", 2)
                environment key.trim(), value.trim()
            }
        }
    }
}

test {
    useJUnitPlatform()
}

// TEMPORARY exclusions
sourceSets {
    test {
        java {
            exclude 'ca/mcgill/ecse321/gallerysystem/integration_test/GallerySystemRestControllerIntegrationTests.java'
            exclude 'ca/mcgill/ecse321/gallerysystem/service/TestCreateOrder.java'
            exclude 'ca/mcgill/ecse321/gallerysystem/service/TestCreateSelectedItem.java'
            exclude 'ca/mcgill/ecse321/gallerysystem/service/TestGallerySystemService.java'
        }
    }
}
